<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESEC Staff Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#ffffff;
}

.login-box{
    width:380px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#4f46e5;
    margin-bottom:5px;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.input-box{
    margin-bottom:20px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.input-box input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    font-size:15px;
}

.input-box input:focus{
    border-color:#4f46e5;
}

button{
    width:100%;
    padding:13px;
    border:none;
    background:#4040e2;
    color:#fff;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#4338ca;
}
img{
    border-radius:50%;
}
.logo{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:15px;
}

.logo img{
    width:120px;
    height:120px;
    object-fit:contain;
}
</style>

</head>
<link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRtJ-TKbiE5DwCfAHONZQt0uLO6G4xwUTrpcLUmvoYgwA&s">
<body>

<div class="login-box">
<div class="logo">
    <img src="https://erode-sengunthar.ac.in/talentexam26/logo.png" alt="ESEC Logo">
</div>


<h2>ESEC</h2>


<p>Staff Login</p>
<form id="loginForm">

<div class="input-box">
<label>Staff ID</label>
<input type="text" id="staffId" required>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" id="password" required>
</div>

<button type="submit">Login</button>

</form>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("loginForm");

    form.addEventListener("submit", function (e) {
        e.preventDefault();

        const staff = document.getElementById("staffId").value.trim();
        const password = document.getElementById("password").value;

        if (staff === "ESEC01" && password === "esec") {
            alert("Login Successful");
            window.location.href = "dashboard.html";
        } else {
            alert("Invalid Staff ID or Password");
        }
    });

});
</script>
</body>
</html>
